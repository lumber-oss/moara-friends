name: auto-pr

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  actions: write

env:
  PAT: ${{ secrets.GITHUB_TOKEN }}

concurrency:
  group: auto-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install -D @playwright/test
          npx playwright install chromium --with-deps

      - name: Validate PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ env.PAT }}
          script: |
            const { runValidation } = await import('${{ github.workspace }}/scripts/validate-pr.mjs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;
            const prHead = context.payload.pull_request.head;
            const prAuthor = context.payload.pull_request.user.login;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            await runValidation({
              owner, repo, pull_number, prHead, prAuthor, runUrl, github, core,
            });
