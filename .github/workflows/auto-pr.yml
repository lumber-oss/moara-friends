name: auto-pr

# PR 校验 + 自动合并 workflow
#
# 触发：pull_request_target (opened/synchronize/reopened)
#   ⚠️ 用 pull_request_target 而非 pull_request，因为贡献者从 fork 提 PR 时，
#      pull_request 会以 fork 的 ref 跑代码，有安全风险；pull_request_target 用 base 的代码 + secrets。
#
# 校验维度：
#   1. PR 只能改 data/friends/ 下单个 .json 文件
#   2. JSON 必须是对象
#   3. name 必填非空字符串
#   4. url 必填、必须是 http/https URL
#   5. avatar 可空、若提供必须是字符串
#   6. description 可选、若提供必须是字符串
#   7. vip 字段一律拒绝（PR 携带 vip 立即终止，防作弊）
#   8. URL 可达性检查（详见 fetchWithRetry 函数注释）
#   9. avatar 可达性 + content-type 校验
#
# 评论策略：
#   - 失败时发 1 条评论告知错误清单 + Action 日志链接，然后关闭 PR
#   - 成功时不评论，直接 squash merge + 触发 build workflow
#
# 不做（按用户要求）：
#   - 双向链接验证（爬 backlink 页面）
#   - DNS 所有权验证
#   - Playwright 渲染
#   - 爬虫
#   - feed 字段
#   - 成功评论 / 欢迎评论 / 进度评论

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  actions: write  # 用于触发 build workflow (createWorkflowDispatch)

env:
  PAT: ${{ secrets.GITHUB_TOKEN }}

concurrency:
  group: auto-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ env.PAT }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;
            const prHead = context.payload.pull_request.head;
            const prAuthor = context.payload.pull_request.user.login;

            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            // 失败时关闭 PR
            async function closePR() {
              try {
                await github.rest.pulls.update({ owner, repo, pull_number, state: 'closed' });
              } catch (e) {
                core.warning(`close PR failed: ${e.message}`);
              }
            }

            // 失败辅助：记录日志 + 发评论 + 关闭 PR
            // 评论只发 1 条，包含错误清单和 Action 日志链接
            async function fail(title, lines) {
              core.error(`❌ ${title}`);
              for (const l of lines) core.error(`  - ${l}`);

              // 评论格式：
              //   - 空行 → 保留空行（分段）
              //   - 已以列表前缀 (- / * / 数字.) 开头 → 不再加前缀
              //   - 代码块 (```) 或缩进行 → 不加前缀
              //   - 其他普通行 → 加 `- ` 前缀
              const body = [
                `## ❌ ${title}`,
                '',
                ...lines.map((l) => {
                  if (l === '') return '';
                  if (l.startsWith('```') || l.startsWith('    ')) return l;
                  if (/^\s*([-*+]|\d+\.)\s/.test(l)) return l;
                  return `- ${l}`;
                }),
                '',
                '---',
                '修改后 push 到本 PR 会触发重新校验。  ',
                `[查看 Action 运行日志](${runUrl})`,
              ].join('\n');
              try {
                await github.rest.issues.createComment({ owner, repo, issue_number: pull_number, body });
              } catch (e) {
                core.warning(`createComment failed: ${e.message}`);
              }

              await closePR();
            }

            // ── 可达性检查 ───────────────────────────────────
            // 改进点：
            //   1. 多 UA 轮换（GitHub Actions IP 容易被风控，用浏览器 UA 提高通过率）
            //   2. 直接 GET + Range（替代 HEAD）：少数服务器拒绝 HEAD 或 HEAD 返回 405；
            //      Range: bytes=0-1023 只取首 1KB，带宽极小但服务器都支持
            //   3. 重试 3 次，指数退避（500ms / 1500ms / 4500ms）
            //   4. 超时 15s（避免误杀慢站）
            //   5. avatar 必须是 image/* content-type（防 HTML 404 页面伪装）
            //   6. 追踪重定向链（最多 5 跳），失败时记录最终落点
            const USER_AGENTS = [
              'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36',
              'Mozilla/5.0 (Macintosh; Intel Mac OS X 14_5) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Safari/605.1.15',
              'Mozilla/5.0 (compatible; Googlebot/2.1; +https://www.google.com/bot.html)',
            ];

            function sleep(ms) { return new Promise((r) => setTimeout(r, ms)); }

            async function fetchWithRetry(url, { requireImage = false } = {}) {
              const errors = [];
              const redirects = [];

              for (let attempt = 0; attempt < 3; attempt++) {
                const ua = USER_AGENTS[attempt % USER_AGENTS.length];
                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), 15000);
                try {
                  const res = await fetch(url, {
                    method: 'GET',
                    redirect: 'manual',
                    signal: controller.signal,
                    headers: {
                      'User-Agent': ua,
                      'Accept': requireImage ? 'image/*' : '*/*',
                      'Range': 'bytes=0-1023',
                      'Accept-Encoding': 'identity',
                    },
                  });
                  clearTimeout(timer);

                  // 手动跟随重定向（最多 5 跳）
                  let finalRes = res;
                  let location = res.headers.get('location');
                  let hops = 0;
                  while ([301, 302, 303, 307, 308].includes(finalRes.status) && location && hops < 5) {
                    redirects.push(`${finalRes.status} → ${location}`);
                    const nextUrl = new URL(location, url).href;
                    const c2 = new AbortController();
                    const t2 = setTimeout(() => c2.abort(), 15000);
                    finalRes = await fetch(nextUrl, {
                      method: 'GET',
                      redirect: 'manual',
                      signal: c2.signal,
                      headers: {
                        'User-Agent': ua,
                        'Accept': requireImage ? 'image/*' : '*/*',
                        'Range': 'bytes=0-1023',
                        'Accept-Encoding': 'identity',
                      },
                    });
                    clearTimeout(t2);
                    location = finalRes.headers.get('location');
                    hops++;
                  }

                  if (finalRes.status >= 200 && finalRes.status < 400) {
                    if (requireImage) {
                      const ct = (finalRes.headers.get('content-type') || '').toLowerCase();
                      if (!ct.startsWith('image/')) {
                        errors.push(`Content-Type 不是 image/* (实际: ${ct || '空'})`);
                        await sleep(500 * Math.pow(3, attempt));
                        continue;
                      }
                    }
                    return {
                      ok: true,
                      status: finalRes.status,
                      finalUrl: finalRes.url,
                      contentType: finalRes.headers.get('content-type'),
                      redirects,
                      attempts: attempt + 1,
                    };
                  }

                  // 405/403/416 时退回完整 GET（不带 Range，部分 CDN 对 Range 敏感）
                  if (finalRes.status === 405 || finalRes.status === 403 || finalRes.status === 416) {
                    const c3 = new AbortController();
                    const t3 = setTimeout(() => c3.abort(), 15000);
                    const r3 = await fetch(url, {
                      method: 'GET',
                      redirect: 'follow',
                      signal: c3.signal,
                      headers: {
                        'User-Agent': ua,
                        'Accept': requireImage ? 'image/*' : '*/*',
                      },
                    });
                    clearTimeout(t3);
                    if (r3.status >= 200 && r3.status < 400) {
                      if (requireImage) {
                        const ct = (r3.headers.get('content-type') || '').toLowerCase();
                        if (!ct.startsWith('image/')) {
                          errors.push(`Content-Type 不是 image/* (实际: ${ct || '空'})`);
                          await sleep(500 * Math.pow(3, attempt));
                          continue;
                        }
                      }
                      return {
                        ok: true,
                        status: r3.status,
                        finalUrl: r3.url,
                        contentType: r3.headers.get('content-type'),
                        redirects,
                        attempts: attempt + 1,
                        fallback: true,
                      };
                    }
                    errors.push(`HTTP ${r3.status}`);
                  } else {
                    errors.push(`HTTP ${finalRes.status}`);
                  }
                } catch (e) {
                  clearTimeout(timer);
                  errors.push(e.name === 'AbortError' ? '超时(15s)' : e.message);
                }
                if (attempt < 2) await sleep(500 * Math.pow(3, attempt));
              }

              return { ok: false, errors, redirects, attempts: 3 };
            }

            function formatCheckResult(r, label, url) {
              if (r.ok) {
                const parts = [`✓ ${label} 可达 (HTTP ${r.status})`];
                if (r.attempts > 1) parts.push(`  · 重试 ${r.attempts} 次后成功`);
                if (r.fallback) parts.push(`  · 使用 fallback GET`);
                if (r.redirects && r.redirects.length) {
                  parts.push(`  · 重定向链：${url} → ${r.redirects.join(' → ')}`);
                }
                if (r.contentType) parts.push(`  · Content-Type: ${r.contentType}`);
                return parts.join('\n');
              }
              const parts = [`✗ ${label} 不可达 (${url})`];
              parts.push(`  · 尝试 ${r.attempts} 次，错误：${r.errors.join('；')}`);
              if (r.redirects && r.redirects.length) {
                parts.push(`  · 重定向链：${r.redirects.join(' → ')}`);
              }
              return parts.join('\n');
            }

            // ──────────────────────────────────────────────────
            // 主流程开始
            // ──────────────────────────────────────────────────

            // ── 1. PR 文件变更范围校验 ─────────────────────────
            let files = [];
            try {
              for await (const res of github.paginate.iterator(
                github.rest.pulls.listFiles,
                { owner, repo, pull_number, per_page: 100 }
              )) {
                files.push(...res.data);
              }
            } catch (e) {
              await fail('无法读取 PR 文件清单', [`错误：${e.message}`]);
              return;
            }

            if (files.length !== 1) {
              await fail('PR 只能包含一个文件变更', [
                `当前变更数：${files.length}`,
                '请保证每个 PR 仅新增/修改/删除 data/friends/ 下单个 .json 文件。',
              ]);
              return;
            }

            const file = files[0];
            const FRIENDS_PREFIX = 'data/friends/';
            if (!file.filename.startsWith(FRIENDS_PREFIX)) {
              await fail('文件路径不合法', [
                `检测到文件：${file.filename}`,
                `只允许更改 ${FRIENDS_PREFIX} 下的文件。`,
              ]);
              return;
            }

            if (!['added', 'modified', 'removed'].includes(file.status)) {
              await fail('不支持的文件操作', [`status: ${file.status}`]);
              return;
            }

            // ── 2. 删除操作：跳过内容校验，直接合并 ───────────
            if (file.status === 'removed') {
              core.info('删除操作，跳过校验，准备合并');
            } else {
              // ── 3. JSON 解析与 schema 校验 ─────────────────
              if (!file.filename.endsWith('.json')) {
                await fail('文件类型不合法', [
                  `检测到非 .json 文件：${file.filename}`,
                  'data/friends/ 下只允许 .json 文件。',
                ]);
                return;
              }

              // 通过 PR files API 已返回的 patch 字段拿文件内容
              // 比 getContent 更稳定（getContent 在 pull_request_target 事件下
              // 对 fork PR 的 head ref 可能 404）
              let rawContent = '';
              if (file.patch) {
                rawContent = file.patch
                  .split('\n')
                  .filter((line) => !line.startsWith('@@') && !line.startsWith('---') && !line.startsWith('+++'))
                  .map((line) => (line.startsWith('+') ? line.slice(1) : line.startsWith(' ') ? line.slice(1) : line))
                  .join('\n')
                  .trim();
              } else if (file.status === 'added' || file.status === 'modified') {
                // patch 字段为空（大文件或 API 异常），回退到 raw_url 拉取
                try {
                  const res = await fetch(file.raw_url, {
                    headers: { Authorization: `Bearer ${process.env.GITHUB_TOKEN}` },
                  });
                  if (!res.ok) throw new Error(`HTTP ${res.status}`);
                  rawContent = await res.text();
                } catch (e) {
                  await fail('无法读取文件内容', [`错误：${e.message}`, `raw_url: ${file.raw_url}`]);
                  return;
                }
              }

              let data;
              try {
                data = JSON.parse(rawContent);
              } catch (e) {
                await fail('JSON 解析失败', [`文件：${file.filename}`, `错误：${e.message}`]);
                return;
              }

              if (!data || typeof data !== 'object' || Array.isArray(data)) {
                await fail('JSON 类型错误', ['JSON 必须是对象，不能是数组或基本类型。']);
                return;
              }

              const errs = [];
              const isNonEmptyString = (v) => typeof v === 'string' && v.trim().length > 0;
              const isNullOrString = (v) => v === null || typeof v === 'string';
              const isHttpUrl = (v) => {
                if (typeof v !== 'string') return false;
                try {
                  const u = new URL(v);
                  return u.protocol === 'http:' || u.protocol === 'https:';
                } catch { return false; }
              };

              if (!isNonEmptyString(data.name)) errs.push('name 必填且为非空字符串');
              if (!isNonEmptyString(data.url)) errs.push('url 必填且为非空字符串');
              else if (!isHttpUrl(data.url)) errs.push('url 必须是 http/https URL');
              if (data.avatar !== undefined && !isNullOrString(data.avatar))
                errs.push('avatar 必须是字符串或 null（或省略）');
              if (data.description !== undefined && typeof data.description !== 'string')
                errs.push('description 必须是字符串（或省略）');

              // ── 4. vip 反作弊：PR 一律拒绝 ───────────────
              if (Object.prototype.hasOwnProperty.call(data, 'vip')) {
                await fail('检测到 vip 字段，已终止', [
                  'vip 字段仅站主直推 main 时可用，PR 不可携带。',
                  `文件：${file.filename}`,
                  '请删除 vip 字段后重新 push。',
                ]);
                return;
              }

              if (errs.length) {
                await fail('数据校验未通过', [`文件：${file.filename}`, ...errs]);
                return;
              }

              // ── 5. URL 可达性检查（并行）─────────────────────
              core.info('🌐 正在并行检查站点 URL 和头像 URL 可达性...');

              const tasks = [];
              tasks.push(
                fetchWithRetry(data.url, { requireImage: false })
                  .then((r) => ({ label: '站点 url', url: data.url, result: r }))
              );
              if (typeof data.avatar === 'string' && data.avatar.trim()) {
                tasks.push(
                  fetchWithRetry(data.avatar, { requireImage: true })
                    .then((r) => ({ label: '头像 avatar', url: data.avatar, result: r }))
                );
              }

              const results = await Promise.all(tasks);
              const failedChecks = results.filter((r) => !r.result.ok);

              if (failedChecks.length) {
                const lines = [];
                for (const r of results) {
                  core.info(formatCheckResult(r.result, r.label, r.url));
                  if (!r.result.ok) {
                    // 多行结果用代码块包裹，避免 Markdown 列表渲染歧义
                    lines.push('```');
                    lines.push(formatCheckResult(r.result, r.label, r.url));
                    lines.push('```');
                    lines.push('');
                  }
                }
                await fail('URL 可达性检查未通过', lines);
                return;
              }

              // 全部通过，日志记录详情
              for (const r of results) {
                core.info(formatCheckResult(r.result, r.label, r.url));
              }
            }

            // ── 6. 自动合并 ────────────────────────────────────
            core.info('✅ 所有校验通过，执行自动合并');

            try {
              const mergeRes = await github.rest.pulls.merge({
                owner,
                repo,
                pull_number,
                merge_method: 'squash',
                commit_title: `friends: ${file.status} ${file.filename} (#${pull_number})`,
                commit_message: `由 auto-pr workflow 自动合并\n\nCo-authored-by: ${prAuthor}`,
              });
              core.info(`✅ 合并成功：${mergeRes.data.sha}`);

              // 触发 build workflow（GITHUB_TOKEN 触发的 push 不会自动触发其他 workflow，
              // 需要 workflow_dispatch 手动启动）
              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner,
                  repo,
                  workflow_id: 'build.yml',
                  ref: 'main',
                });
                core.info('✅ build workflow 已触发');
              } catch (e) {
                core.warning(`trigger build workflow failed: ${e.message}`);
              }
            } catch (e) {
              await fail('自动合并失败', [`错误：${e.message}`, '请手动合并此 PR 或联系仓库管理员。']);
            }
