name: build

on:
  push:
    branches: [main]
    paths:
      - 'data/friends/**'
      - 'scripts/build.js'
      - '.github/workflows/build.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write

concurrency:
  group: build-friends
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build friends.json
        run: node scripts/build.js

      - name: Commit friends.json if changed
        id: commit
        run: |
          set -euo pipefail
          if git diff --quiet -- friends.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          git config user.name "moaradc"
          git config user.email "143486936+moaradc@users.noreply.github.com"
          git add friends.json
          git commit -m "chore: rebuild friends.json [skip ci]"
          git push
          echo "changed=true" >> $GITHUB_OUTPUT

      - name: Purge jsDelivr cache
        if: steps.commit.outputs.changed == 'true'
        run: |
          curl -sL "https://purge.jsdelivr.net/gh/moaradc/moara-friends@main/friends.json" | python3 -c "import json,sys; d=json.load(sys.stdin); print('purge:', d.get('status','?'))"
