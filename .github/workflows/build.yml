name: build

# 重建 friends.json 并 commit 回 main
#
# 触发：
#   1. push 到 main 且改了 data/friends/ / scripts/build.js / 本 workflow
#      （注意：用 GITHUB_TOKEN 触发的 push 不会触发其他 workflow，所以 PR 合并后走 workflow_dispatch）
#   2. workflow_dispatch（由 auto-pr.yml 在合并 PR 后手动触发）
#   3. schedule（每小时兜底一次，防止前两种漏触发的极端情况）

on:
  push:
    branches: [main]
    paths:
      - 'data/friends/**'
      - 'scripts/build.js'
      - '.github/workflows/build.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write

concurrency:
  group: build-friends
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 用 PAT 提交时不会触发后续 workflow，避免循环
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build friends.json
        run: node scripts/build.js

      - name: Commit friends.json if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- friends.json; then
            echo "✓ friends.json 未变化，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add friends.json
          git commit -m "chore: rebuild friends.json [skip ci]"
          git push
          echo "✓ friends.json 已推送，jsDelivr 缓存会在数分钟内刷新"
